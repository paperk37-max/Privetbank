const VW=VAR.reduce((s,v)=>s+v[0],0);
const key=t=>((t.y*100+t.m)*100+t.d)*1440+t.t;
function fin(T,S,op){T.sort((a,b)=>key(a)-key(b));const open=(S.keep!==false||op==null)?e100(S.balance)-T.reduce((s,t)=>s+t.c,0):op;let b=open;
 T.forEach((t,i)=>{t.id=i+1;t.type=t.c>0?'Einnahme':'Ausgabe';b+=t.c;t.bal=b;t.ref='REF-'+String(i+1).padStart(5,'0')});return{tx:T,open,end:b}}
function build(S,sh){
 const R=rng(7919+S.start),rnd=(a,b)=>a+R()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(R()*a.length)],T=[];
 const add=(y,m,d,t,name,cat,c,meth,txt)=>T.push({y,m,d,t,name,cat,c,meth,txt});
 const ct=n=>'Kartenzahlung '+n+' · Visa Infinite **** 4821';
 for(let k=0;;k++){
  const y=S.start+Math.floor((10+k)/12),m=(10+k)%12+1;if(y>2026||y==2026&&m>11)break;
  const last=y==2026&&m==11,md=last?3:new Date(y,m,0).getDate(),mn=MN[m-1]+' '+y;
  const g=Math.min(S.max,Math.max(S.min,Math.round(rnd(S.min,S.max)/50)*50));

  let fx=0,lx=0;
  [[1,'Hausverwaltung Kassel','Wohnen',1380,'Dauerauftrag','Miete '+mn],[4,'Städtische Werke Kassel','Wohnen',rnd(95,125),'Lastschrift','Abschlag Strom/Gas'],
   [12,'Mobilfunk Vodafone','Abonnements',39.99,'Lastschrift','Mobilfunkvertrag'],[7,'Netflix','Abonnements',13.99,'Kartenzahlung','Streaming-Abo'],

  ].forEach(([d,n,c,a,me,tx])=>{if(d<=md){a=e100(a);fx+=a;add(y,m,d,ri(420,900),n,c,-a,me,me=='Kartenzahlung'?ct(n):tx)}});
  [[13,6,'HERMÈS',[690,890,1190,1450]],[9,4,'PRADA',[490,650,790,1090]]].forEach(([q,z,n,v])=>{
   if(k%q==z){const a=e100(pick(v));lx+=a;add(y,m,ri(1,md),ri(660,1140),n,'Luxus & Mode',-a,'Kartenzahlung',ct(n))}});
  let B=Math.round((rnd(.6,.76)+sh)*g*100)-fx-lx;B=last?15000:Math.max(30000,B);

  }
 }
 return fin(T,S);
}
function gen(S){let sh=0,o;for(let i=0;i<14;i++){o=build(S,sh);if(o.open>=250000&&o.open<=1500000)break;sh=Math.max(-.3,Math.min(.25,sh+(o.open<250000?.015:-.015)))}return o}

function spark(){const m={};DB.tx.forEach(t=>m[t.y*12+t.m]=t.bal);const v=Object.keys(m).sort((a,b)=>a-b).slice(-13).map(k=>m[k]),lo=Math.min(...v),rg=(Math.max(...v)-lo)||1;
 return`<svg viewBox="0 0 300 70" preserveAspectRatio="none"><polyline fill="none" stroke="currentColor" stroke-width="2.5" vector-effect="non-scaling-stroke" points="${v.map((x,i)=>(i*300/(v.length-1||1)).toFixed(1)+','+(64-(x-lo)/rg*56).toFixed(1)).join(' ')}"/></svg>`}
const dl=a=>'<dl>'+a.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')+'</dl>';
function cardSvg(){const R=rng(20261107),T='font-family="-apple-system,\'Helvetica Neue\',Arial,sans-serif"';
 const br=(a,b)=>{let o='';for(let y=0;y<340;y++){const r=R();o+=`<rect y="${y}" width="540" height="1" fill="${r>.5?'#fff':'#000'}" opacity="${(Math.abs(r-.5)*a).toFixed(3)}"/>`;if(R()<.35){const x=Math.floor(R()*400),w=60+Math.floor(R()*320);o+=`<rect x="${x}" y="${y}" width="${w}" height="1" fill="${R()>.5?'#fff':'#000'}" opacity="${(R()*b).toFixed(3)}"/>`}}return o};
 const B=br(.16,.1),P=br(.5,.3);
return`<svg class="vc" viewBox="0 0 540 340" role="img" aria-label="Visa Infinite The Black"><defs>

function dash(){const cm=DB.tx.filter(t=>t.y==2026&&t.m==11);
 return`<p class="hi">Guten Tag, Herr Zeismann</p><div class="hero"><div class="hl"><small>Gesamtsaldo · Premium Privatkonto</small><h1>${eur(DB.end)}</h1><small>Paul Zeismann · **** 4821</small><small>Letzte Aktualisierung: ${today()}</small></div><div class="vcw">${cardSvg()}</div></div>
 <div class="grid"><div class="card"><small>Einnahmen November 2026</small><b class="p">${eur(sm(cm,1))}</b></div><div class="card"><small>Ausgaben November 2026</small><b>${eur(sm(cm,0))}</b></div><div class="card"><small>Aktueller Kontostand</small><b>${eur(DB.end)}</b></div></div>
 <div class="card" style="margin-top:16px"><small>Kontoverlauf, letzte 13 Monatsenden</small>${spark()}</div>
 <h2>Letzte Buchungen</h2><div class="card">${DB.tx.slice(-8).reverse().map(row).join('')}<div class="btns" style="margin-top:12px"><button class="btn" data-go="tx">Alle Umsätze anzeigen</button></div></div>`}
let Q={q:'',y:'',t:'',s:'d-'},F=[],shown=0,io;
function flt(){let ys='';for(let y=DB.tx[0].y;y<=DB.tx[DB.tx.length-1].y;y++)ys+=`<option ${Q.y==y?'selected':''}>${y}</option>`;
 return`<div class="card"><div class="flt"><input id="q" type="search" placeholder="Händler oder Buchungstext suchen" value="${esc(Q.q)}"><select id="y"><option value="">Alle Jahre</option>${ys}</select>
 <select id="s">${[['d-','Neueste zuerst'],['d+','Älteste zuerst'],['a-','Betrag absteigend'],['a+','Betrag aufsteigend']].map(([v,l])=>`<option value="${v}" ${Q.s==v?'selected':''}>${l}</option>`).join('')}</select></div>
 <div class="seg">${[['','Alle'],['in','Einnahmen'],['out','Ausgaben']].map(([v,l])=>`<button data-t="${v}" class="${Q.t==v?'on':''}">${l}</button>`).join('')}</div><small id="cnt"></small></div><div class="card" id="list"></div><div id="sent"></div>`}
function txv(){return'<h2>Umsätze</h2>'+flt()}
function list(){const q=Q.q.trim().toLowerCase();
 F=DB.tx.filter(t=>(!Q.y||t.y==Q.y)&&(!Q.t||((Q.t=='in')==(t.c>0)))&&(!q||(t.name+' '+t.cat+' '+t.txt+' '+t.meth).toLowerCase().includes(q)));
 F.sort(Q.s=='d-'?(a,b)=>b.id-a.id:Q.s=='d+'?(a,b)=>a.id-b.id:Q.s=='a-'?(a,b)=>b.c-a.c:(a,b)=>a.c-b.c);
 $('#cnt').textContent=F.length+(F.length==1?' Buchung gefunden':' Buchungen gefunden');
 $('#list').innerHTML=F.length?'':'<small>Keine Buchungen gefunden. Suchbegriff oder Filter ändern.</small>';shown=0;more();
 io&&io.disconnect();io=new IntersectionObserver(e=>{if(e[0].isIntersecting&&shown<F.length)more()},{rootMargin:'700px'});io.observe($('#sent'))}
function more(){$('#list').insertAdjacentHTML('beforeend',F.slice(shown,shown+60).map(row).join(''));shown+=60;const s=$('#sent');if(io&&s){io.unobserve(s);io.observe(s)}}
function acc(){const i=sm(DB.tx,1),o=sm(DB.tx,0),ok=DB.open+i-o==DB.end;
 return`<h2>Kontodetails</h2><div class="card">${dl([['Kontoinhaber','Paul Zeismann'],['Bank','Meridian Privatbank'],['Kontotyp','Privatkonto · Premium Banking'],['Währung','Euro (EUR)'],['Kontoreferenz','**** 4821'],['Zeitraum der Historie','01.11.'+S.start+' bis '+today()],['Anzahl Buchungen',DB.tx.length],['Anfangsbestand',eur(DB.open)],['Summe Einnahmen','<span class="p">'+eur(i)+'</span>'],['Summe Ausgaben',eur(o)],['Aktueller Kontostand',eur(DB.end)],['Rechenprobe','Anfang + Einnahmen − Ausgaben = Endsaldo '+(ok?'✓':'✗')],['Letzte Aktualisierung',today()]])}</div>`}
function card(){const cs=DB.tx.filter(t=>t.meth!='Überweisung'&&t.c<0&&t.y==2026&&t.m==11);
 return`<h2>Visa-Karte</h2><div class="vcw">${cardSvg()}</div>
 <div class="card">${dl([['Karteninhaber','Paul Zeismann'],['Kartennummer','**** 4821'],['Kartentyp','Visa Infinite · The Black'],['Status','Aktiv'],['Kartenumsätze Nov. 2026',eur(sm(cs,0))]])}</div>
 <h2>Letzte Kartenumsätze</h2><div class="card">${DB.tx.filter(t=>t.txt.startsWith('Kartenzahlung')).slice(-6).reverse().map(row).join('')}</div>`}
const fv=c=>(c/100).toFixed(2).replace('.',',');
function set(){const f=(k,l,h,v)=>`<label>${l}<input id="s_${k}" inputmode="decimal" value="${v}"><small>${h}</small></label>`;
 return`<h2>Einstellungen</h2><div class="card"><div class="f">${f('balance','Aktueller Gesamtsaldo (€)','Standard: 78.493,54',fv(DB.end))}${f('allow','Taschengeld monatlich (€)','Standard: 55',S.allow)}${f('min','Monatliches Einkommen Minimum (€)','Standard: 4.800',S.min)}${f('max','Monatliches Einkommen Maximum (€)','Standard: 6.500',S.max)}${f('extra','Zusätzlicher Eingang November 2026 (€)','Standard: 207',S.extra)}${f('start','Startjahr der Historie','2015 bis 2025, Verlauf beginnt im November. Standard: 2023',S.start)}
 <label style="display:flex;gap:10px;align-items:flex-start;font-weight:500"><input type="checkbox" id="s_keep" ${S.keep!==false?'checked':''} style="width:20px;height:20px;margin-top:2px;flex:none"><span>Gesamtsaldo konstant halten<br><small>Bei Änderungen an Buchungen passt sich der Anfangsbestand an, der Endsaldo bleibt gleich.</small></span></label>
 <div class="btns"><button class="btn pri" data-act="apply">Einstellungen übernehmen</button><button class="btn" data-act="reset">Standardwerte wiederherstellen</button></div><div id="msg"></div></div></div>
 <h2>Buchungen bearbeiten</h2><div class="card"><small>Buchung antippen, um Datum, Händler, Kategorie oder Betrag zu ändern oder sie zu löschen. Änderungen werden gespeichert.</small><div class="btns" style="margin-top:10px"><button class="btn pri" data-act="eadd">+ Neue Buchung</button></div></div>${flt()}`}
const num=v=>{v=String(v).replace(/[\s€]/g,'');if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');return v===''?NaN:Number(v)};
function msg(t,err){const m=$('#msg');if(m){m.textContent=t;m.className=err?'err':''}}
let EID=0;
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(x){}};
function saveLed(){LED={tx:DB.tx.map(({y,m,d,t,name,cat,c,meth,txt})=>({y,m,d,t,name,cat,c,meth,txt})),open:DB.open};wr(LKEY,LED)}
function clearLed(){LED=null;try{localStorage.removeItem(LKEY)}catch(x){}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),3500)}
function keepRender(){const y=scrollY;render();scrollTo(0,y)}
function reset(){if(LED&&!confirm('Alle Änderungen und eigenen Buchungen verwerfen?'))return;S={...DEF};wr(KEY,S);clearLed();DB=gen(S);Q.y='';render();msg('Standardwerte wiederhergestellt. Endsaldo '+eur(DB.end)+'.')}
function apply(){const g=k=>num($('#s_'+k).value),n={balance:g('balance'),allow:g('allow'),min:g('min'),max:g('max'),extra:g('extra'),start:Math.round(g('start')),keep:$('#s_keep').checked};let er='';
 if(Object.values(n).some(isNaN))er='Bitte nur gültige Zahlen eingeben, z. B. 5.200,50.';
 else if(n.min<0||n.max<0||n.allow<0||n.extra<0)er='Beträge dürfen nicht negativ sein.';
 else if(n.min>n.max)er='Das Minimum darf nicht größer als das Maximum sein.';
 else if(n.start<2015||n.start>2025)er='Das Startjahr muss zwischen 2015 und 2025 liegen.';
 if(er)return msg(er,1);
 const rg=['allow','min','max','extra','start'].some(k=>n[k]!==S[k]);
 if(rg&&LED&&!confirm('Diese Änderung berechnet die Umsatzhistorie neu. Manuelle Buchungsänderungen gehen dabei verloren. Fortfahren?'))return;
 S=n;wr(KEY,S);
 if(rg||!LED){clearLed();DB=gen(S)}else{DB=fin(DB.tx,{...S,keep:S.keep||e100(S.balance)!==DB.end},DB.open);saveLed()}
 Q.y='';render();msg('Einstellungen übernommen. '+DB.tx.length+' Buchungen, Endsaldo '+eur(DB.end)+'.')}
function edit(id){const t=id?DB.tx[id-1]:{y:2026,m:11,d:3,t:600,name:'',cat:'Sonstiges',c:-1000,meth:'Kartenzahlung',txt:''};EID=id;
 const o=(v,l,sel)=>`<option value="${v}" ${sel?'selected':''}>${l}</option>`;
 $('#modal').innerHTML=`<div class="sheet"><button class="x" data-close aria-label="Schließen">×</button><h3>${id?'Buchung bearbeiten':'Neue Buchung'}</h3><div class="f" style="max-width:none;margin-top:12px">
 <label>Datum<input id="e_d" type="date" value="${t.y}-${p2(t.m)}-${p2(t.d)}"></label><label>Uhrzeit<input id="e_t" type="time" value="${p2(Math.floor(t.t/60))}:${p2(t.t%60)}"></label>
 <label>Art<select id="e_k">${o(1,'Einnahme',t.c>0)}${o(-1,'Ausgabe',t.c<=0)}</select></label>
 <label>Händler / Absender<input id="e_n" value="${esc(t.name)}"></label>
 <label>Kategorie<input id="e_c" list="cats" value="${esc(t.cat)}"></label><datalist id="cats">${[...new Set(DB.tx.map(x=>x.cat))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
 <label>Betrag (€)<input id="e_a" inputmode="decimal" value="${fv(Math.abs(t.c))}"></label>
 <label>Zahlungsart<select id="e_m">${['Kartenzahlung','Überweisung','Lastschrift','Dauerauftrag','Bargeldabhebung'].map(m=>o(m,m,m==t.meth)).join('')}</select></label>
 <label>Verwendungszweck<input id="e_x" value="${esc(t.txt)}"></label>
 <div class="btns"><button class="btn pri" data-act="esave">Speichern</button>${id?'<button class="btn" data-act="edel">Löschen</button>':''}</div><div id="emsg" class="err" style="font-weight:600"></div></div></div>`;$('#modal').classList.add('on')}
function esave(){const d=$('#e_d').value.split('-').map(Number),tm=($('#e_t').value||'12:00').split(':').map(Number),a=num($('#e_a').value),n=$('#e_n').value.trim(),k=+$('#e_k').value,me=$('#e_m').value;
 if(d.length<3||d.some(isNaN)||d[0]<2000||d[0]>2035)return $('#emsg').textContent='Bitte ein gültiges Datum wählen.';
 if(!n)return $('#emsg').textContent='Bitte Händler bzw. Absender eingeben.';
 if(!(a>0))return $('#emsg').textContent='Bitte einen Betrag größer 0 eingeben.';
 const r={y:d[0],m:d[1],d:d[2],t:tm[0]*60+tm[1],name:n,cat:$('#e_c').value.trim()||'Sonstiges',c:k*e100(a),meth:me,txt:$('#e_x').value.trim()||me+' '+n};
 if(EID)Object.assign(DB.tx[EID-1],r);else DB.tx.push(r);
 DB=fin(DB.tx,S,DB.open);saveLed();$('#modal').classList.remove('on');keepRender();toast('Buchung gespeichert · Endsaldo '+eur(DB.end))}
function edel(){if(DB.tx.length<2||!confirm('Diese Buchung wirklich löschen?'))return;DB.tx.splice(EID-1,1);DB=fin(DB.tx,S,DB.open);saveLed();$('#modal').classList.remove('on');keepRender();toast('Buchung gelöscht · Endsaldo '+eur(DB.end))}
function detail(id){const t=DB.tx[id-1],wd=new Date(t.y,t.m-1,t.d).toLocaleDateString('de-DE',{weekday:'long'});
 $('#modal').innerHTML=`<div class="sheet"><button class="x" data-close aria-label="Schließen">×</button><small>Buchungsdetails</small><h3>${esc(t.name)}</h3><div class="big ${t.c>0?'p':''}">${sg(t.c)}</div>${dl([['Händler / Partner',esc(t.name)],['Buchungsdatum',wd+', '+dt(t)+', '+p2(Math.floor(t.t/60))+':'+p2(t.t%60)+' Uhr'],['Betrag',sg(t.c)],['Kategorie',esc(t.cat)],['Buchungsart',t.type+' · '+t.meth],['Kontostand nach Buchung',eur(t.bal)],['Verwendungszweck',esc(t.txt)],['Referenz',t.ref]])}</div>`;$('#modal').classList.add('on')}
const views={dash,tx:txv,acc,card,set};let V='dash';
function render(){$('#main').innerHTML=views[V]();
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.go==V));if(V=='tx'||V=='set')list()}
function go(v){V=v;document.body.classList.remove('open');render();scrollTo(0,0)}
/* ===== EREIGNISSE ===== */
document.addEventListener('click',e=>{const c=e.target.closest('[data-go],[data-id],[data-t],[data-act],[data-close],#burger,#bd,#modal');if(!c)return;
 if(c.dataset.go)go(c.dataset.go);else if(c.dataset.id)(V=='set'?edit:detail)(+c.dataset.id);
 else if(c.dataset.t!==undefined){Q.t=c.dataset.t;document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b==c));list()}
 else if(c.dataset.act=='apply')apply();else if(c.dataset.act=='reset')reset();else if(c.dataset.act=='esave')esave();else if(c.dataset.act=='edel')edel();else if(c.dataset.act=='eadd')edit(0);
 else if(c.id=='burger')document.body.classList.toggle('open');else if(c.id=='bd')document.body.classList.remove('open');
 else if(c.id=='modal'&&e.target==c||c.dataset.close!==undefined)$('#modal').classList.remove('on')});
document.addEventListener('input',e=>{if(e.target.id=='q'){Q.q=e.target.value;list()}});
document.addEventListener('change',e=>{if(e.target.id=='y'){Q.y=e.target.value;list()}if(e.target.id=='s'){Q.s=e.target.value;list()}});
document.addEventListener('keydown',e=>{if(e.key=='Escape')$('#modal').classList.remove('on')});
render();
</script></body></html>
